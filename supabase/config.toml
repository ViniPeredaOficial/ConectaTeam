# Configuração mínima da Supabase CLI (usada no deploy das Edge Functions)
project_id = "radar-de-pragas"

[functions.triagem]
# Exige um JWT válido (usuário logado, inclusive anônimo)
verify_jwt = true

[functions.alerta]
# Exige JWT; a função ainda confere se o usuário é especialista
verify_jwt = true

[functions.telegram-webhook]
# O Telegram não envia JWT: a função confere o header X-Telegram-Bot-Api-Secret-Token
verify_jwt = false

[functions.avisar-produtor]
# Exige JWT; a função ainda confere se o usuário é especialista
verify_jwt = true
